name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test --test-force-exit test/*.test.ts mirror/*.test.mjs
      - run: sh -n firmware/openwrt/nod-setup.sh && sh -n firmware/openwrt/nod-limits.sh && sh -n firmware/openwrt/nod-sync.sh
      - name: ShellCheck the router scripts (busybox sh on OpenWrt)
        run: shellcheck -s sh -S warning firmware/openwrt/*.sh
